name: Safari iOS (unsigned, experimental)

# macOS minutes are billed at ten times the Linux rate on private repositories,
# so this runs on demand and only when this file changes, not on every pull request.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/safari.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Convert to a Safari Web Extension project
        run: |
          mkdir -p build
          xcrun safari-web-extension-converter dist \
            --project-location build/safari \
            --app-name Spectral \
            --bundle-identifier it.danielededo.spectral \
            --ios-only --swift --copy-resources \
            --no-open --no-prompt --force 2>&1 | tee build/converter.log

      - name: Prefix the extension bundle id with the app's
        env:
          APP_ID: it.danielededo.spectral
        run: |
          # Xcode refuses an embedded extension whose id does not start with the app id,
          # which the converter does not guarantee.
          PBX=$(find build/safari -maxdepth 4 -name project.pbxproj | head -1)
          grep -n 'PRODUCT_BUNDLE_IDENTIFIER' "$PBX"
          perl -pi -e 's/(PRODUCT_BUNDLE_IDENTIFIER = )"?([^";]+)"?;/$1 . ($2 eq $ENV{APP_ID} ? $2 : "$ENV{APP_ID}.Extension") . ";"/e' "$PBX"
          grep -n 'PRODUCT_BUNDLE_IDENTIFIER' "$PBX"

      - name: Build the app for iPhone without signing
        run: |
          PROJECT=$(find build/safari -maxdepth 3 -name '*.xcodeproj' | head -1)
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | jq -r '.project.schemes[0]')
          echo "Project: $PROJECT, scheme: $SCHEME"
          status=0
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || status=$?
          grep -E 'error:|\*\* BUILD' build/xcodebuild.log || true
          exit "$status"

      - name: Package the .ipa
        run: |
          APP=$(find build/derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          ls "$APP/PlugIns"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Spectral-unsigned.ipa Payload)
          ls -l build/Spectral-unsigned.ipa

      - name: Report converter warnings
        if: always()
        run: |
          {
            echo '### safari-web-extension-converter'
            echo '```'
            cat build/converter.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: spectral-ios-unsigned
          path: build/Spectral-unsigned.ipa

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: safari-build-logs
          path: build/*.log
